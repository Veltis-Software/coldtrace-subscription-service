spring.application.name=coldtrace-subscription-service
server.port=${PORT:8088}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ct_subscription?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:ct_subscription}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=com.acme.coldtrace.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.messages.basename=messages
coldtrace.identity.url=${IDENTITY_URL:http://localhost:8081}
coldtrace.asset.url=${ASSET_URL:http://localhost:8082}
coldtrace.internal.service-key=${INTERNAL_SERVICE_KEY}
management.endpoints.web.exposure.include=health,info
coldtrace.billing.plan-catalog.operations-stripe-price-id=${STRIPE_OPERATIONS_PRICE_ID:}
coldtrace.billing.plan-catalog.compliance-ai-stripe-price-id=${STRIPE_COMPLIANCE_AI_PRICE_ID:}
coldtrace.billing.stripe.secret-key=${STRIPE_SECRET_KEY:}
coldtrace.billing.stripe.webhook-signing-secret=${STRIPE_WEBHOOK_SECRET:}
coldtrace.billing.stripe.checkout-success-url=${BILLING_CHECKOUT_SUCCESS_URL:}
coldtrace.billing.stripe.checkout-cancel-url=${BILLING_CHECKOUT_CANCEL_URL:}
coldtrace.billing.stripe.customer-portal-return-url=${BILLING_CUSTOMER_PORTAL_RETURN_URL:}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://127.0.0.1:4200}
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,X-Correlation-Id
cors.exposed-headers=X-Correlation-Id,Location
cors.max-age=3600
